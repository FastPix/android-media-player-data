pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }

        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri("https://maven.pkg.github.com/FastPix/android-core-data-sdk")
            // GitHub Packages requires authentication even for public packages.
            // Put gpr.user / gpr.key in ~/.gradle/gradle.properties (or pass -Pgpr.user=... -Pgpr.key=...),
            // or export GITHUB_ACTOR / GITHUB_TOKEN in CI.
            credentials {
                username = settings.providers.gradleProperty("gpr.user").getOrElse(System.getenv("GITHUB_ACTOR") ?: "")
                password = settings.providers.gradleProperty("gpr.key").getOrElse(System.getenv("GITHUB_TOKEN") ?: "")
            }
        }
    }

}

rootProject.name = "Android Medai Player"
include ':library'
include ':app'
